{% extends "base.html" %}
{% block title %}Upload{% endblock %}

{% block content %}
<h3 class="mb-3">Upload a research paper (PDF)</h3>

<div class="card">
  <div class="card-body">
    <form method="post" action="{{ url_for('upload_post') }}" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Title (optional)</label>
        <input class="form-control" name="title" placeholder="If empty, filename will be used">
      </div>

      <div class="mb-3">
        <label class="form-label">PDF file</label>
        <input class="form-control" type="file" name="paper" accept="application/pdf" required>
      </div>

      <button class="btn btn-primary">Upload & create project</button>
    </form>
  </div>
</div>
{% endblock %}
